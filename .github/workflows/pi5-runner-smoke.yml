name: Raspberry Pi 5 Runner Smoke (nexverse-viewer)

on:
  push:
    branches:
      - ci/pi5-runner-smoke-20261015
    paths:
      - .github/workflows/pi5-runner-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Validate dedicated Pi ARM64 runner
    runs-on: [self-hosted, linux, ARM64, pi5-ogl]
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify environment and repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$GITHUB_REPOSITORY" = "marlin198323-glitch/nexverse-viewer"
          test -f AGENTS.md
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "PI5_SMOKE_OK"
